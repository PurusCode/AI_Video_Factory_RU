[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-farm"
version = "0.1.0"
description = "Локальная фабрика технологических видео для Rutube и VK Video"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "Proprietary - project files provided to the recipient"}
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "Pillow>=10.4.0",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
tts = ["piper-tts>=1.8.0,<2.0", "num2words>=0.5.14,<0.6"]
test = ["pytest>=8.0.0", "num2words>=0.5.14,<0.6"]

[project.scripts]
video-farm = "video_farm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
